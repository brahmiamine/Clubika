name: Supply chain

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high/critical)
        run: node scripts/audit-dependencies.mjs
      - name: Check expiring exceptions
        run: node scripts/check-exceptions.mjs
      - name: Check GitHub Action pins
        run: node scripts/check-action-pins.mjs

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: sudo bash scripts/install-pinned-tool.sh gitleaks
      - name: Scan git history and working tree
        run: gitleaks detect --source . --redact --exit-code 1 --config .gitleaks.toml

  image-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned trivy
        run: sudo bash scripts/install-pinned-tool.sh trivy
      - name: Scan lockfile (HIGH/CRITICAL)
        run: |
          set -euo pipefail
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed --format table .
      - name: Scan base image OS (CRITICAL)
        run: |
          set -euo pipefail
          base="$(awk -F= '/^NODE_IMAGE=/{print $2; exit}' deploy/runtime-images.lock)"
          if [[ -z "$base" || "$base" == *'${'* ]]; then
            echo "NODE_IMAGE introuvable dans deploy/runtime-images.lock" >&2
            exit 2
          fi
          echo "Scan OS de l'image de base : $base"
          docker pull "$base"
          # Les paquets npm embarqués dans l’image Node officielle ne sont pas
          # notre lockfile (déjà scanné en `trivy fs`). HIGH Debian sans point
          # release : rapportés, pas bloquants — Dependabot docker + #36.
          # CVE OS CRITICAL du socle vendor : exceptions nommées, compensées,
          # expirantes dans security/exceptions.json (pas de .trivyignore commité).
          node scripts/generate-trivy-ignore.mjs trivy-image-os .trivyignore.generated
          trivy image --scanners vuln --pkg-types os --severity HIGH \
            --ignore-unfixed --format table --exit-code 0 "$base"
          trivy image --scanners vuln --pkg-types os --severity CRITICAL \
            --ignore-unfixed --ignorefile .trivyignore.generated \
            --format table --exit-code 1 "$base"
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p artifacts
          trivy fs --format cyclonedx --output artifacts/sbom.cdx.json .
          python3 - <<'PY'
          import json
          sbom = json.load(open("artifacts/sbom.cdx.json"))
          blob = json.dumps(sbom).lower()
          for needle in ("password", "private_key", "begin rsa", "vapid"):
              if needle in blob:
                  raise SystemExit(f"SBOM contains forbidden token {needle}")
          print("SBOM CycloneDX écrit, sans secret évident.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
