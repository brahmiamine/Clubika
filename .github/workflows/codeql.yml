name: CodeQL

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:javascript-typescript'
          # Le dépôt n’a pas code scanning activé (réglage GitHub). On produit le
          # SARIF localement : scanner indisponible = pas de fichier → échec.
          upload: never
          output: sarif-results
      - name: Confirm SARIF produced
        run: |
          set -euo pipefail
          if ! ls sarif-results/*.sarif >/dev/null 2>&1; then
            echo "CodeQL n’a pas produit de SARIF (scanner indisponible)." >&2
            exit 2
          fi
          echo "SARIF CodeQL produit. Activer code scanning dans les réglages du dépôt pour l’onglet Security."
