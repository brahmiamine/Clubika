name: clubika

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: Europe/Paris
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: "3306"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: Europe/Paris
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_COUNT: "1"
      CHAT_INSTANCE_COUNT: "1"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
